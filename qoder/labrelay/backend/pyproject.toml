[project]
name = "labrelay-backend"
version = "0.1.0"
description = "Research project handoff and adaptive learning-path backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "PyMySQL>=1.1,<2",
  "PyYAML>=6.0,<7",
  "pypdf>=5,<6",
  "powercontext[client]>=1.4.1,<2",
  "pyseekdb>=1.4,<2",
  "anyio>=4.4,<5",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labrelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``src`` is the package root; ``.`` makes the ``tests`` package itself importable, so the
# shared fixtures in ``tests/helpers_*.py`` can be imported by unit, integration and e2e runs.
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
