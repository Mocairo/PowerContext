name: labrelay

services:
  seekdb:
    image: ${SEEKDB_IMAGE:-oceanbase/seekdb:latest}
    container_name: labrelay-seekdb
    environment:
      ROOT_PASSWORD: ${SEEKDB_ROOT_PASSWORD:?Set SEEKDB_ROOT_PASSWORD in .env}
      SEEKDB_DATABASE: ${SEEKDB_DATABASE:-labrelay}
      CPU_COUNT: "1"
      MEMORY_LIMIT: 2G
      LOG_DISK_SIZE: 2G
      DATAFILE_SIZE: 2G
      DATAFILE_NEXT: 2G
      DATAFILE_MAXSIZE: 50G
    ports:
      - "${SEEKDB_SQL_PORT:-2881}:2881"
      - "${SEEKDB_RPC_PORT:-2886}:2886"
    volumes:
      - seekdb-data:/var/lib/seekdb

volumes:
  seekdb-data:
